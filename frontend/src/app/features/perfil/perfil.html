<h1>Perfil</h1>

<div class="perfil">
  <div class="foto">
    <app-avatar [nome]="usuario()?.nome ?? ''" [fotoUrl]="usuario()?.fotoUrl ?? null" [tamanho]="140" />
    <button type="button" class="editar-foto" aria-label="Alterar foto" disabled title="Upload de foto em breve">
      <span class="icone">edit_square</span>
    </button>
  </div>

  <form class="card" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
    @if (mensagem(); as m) {
      <div class="alerta" [class]="m.tipo" role="status">{{ m.texto }}</div>
    }

    <div class="linha">
      <label for="nome">Nome</label>
      <input id="nome" class="input" formControlName="nome" autocomplete="name" [class.invalido]="invalido('nome')" />
    </div>
    <div class="linha">
      <label for="telefone">Telefone</label>
      <input id="telefone" class="input" formControlName="telefone" autocomplete="tel" placeholder="(11) 3333-4444"
        [class.invalido]="invalido('telefone')" />
    </div>
    <div class="linha">
      <label for="celular">Celular</label>
      <input id="celular" class="input" formControlName="celular" autocomplete="tel" placeholder="(11) 99999-0000"
        [class.invalido]="invalido('celular')" />
    </div>
    <div class="linha">
      <label for="email">E-mail</label>
      <input id="email" type="email" class="input" formControlName="email" autocomplete="email" [class.invalido]="invalido('email')" />
    </div>
    <div class="linha">
      <label for="nascimento">Aniversário</label>
      <input id="nascimento" type="date" class="input" formControlName="dataNascimento" />
    </div>
    <div class="linha">
      <label for="sexo">Sexo</label>
      <select id="sexo" class="input" formControlName="sexo">
        <option [ngValue]="null">Selecione</option>
        @for (s of sexos; track s.valor) {
          <option [ngValue]="s.valor">{{ s.rotulo }}</option>
        }
      </select>
    </div>
    <div class="linha">
      <label for="cidade">Cidade</label>
      <input id="cidade" class="input" formControlName="cidade" autocomplete="address-level2" />
    </div>

    <button type="submit" class="btn btn-primario" [disabled]="salvando()">
      {{ salvando() ? 'Salvando...' : 'Salvar alterações' }}
    </button>
  </form>
</div>
