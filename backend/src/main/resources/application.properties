spring.application.name=eventsync
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventsync?serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:eventsync}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

server.port=${PORT:8080}
